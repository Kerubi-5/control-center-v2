<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Center</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --container-bg: #161b22;
      --text-color: #c9d1d9;
      --muted: #8b949e;
      --accent-color: #238636;
      --accent-hover: #2ea043;
      --border-color: #30363d;
      --input-bg: #0d1117;
      --error-color: #f85149;
      --link: #58a6ff;
      --bar-height: 52px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    body.locked {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    body.unlocked {
      display: grid;
      grid-template-rows: var(--bar-height) 1fr;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      background: var(--container-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 600;
      color: #f0f6fc;
    }

    .gate-copy {
      font-size: 14px;
      color: var(--muted);
      margin: 0 0 25px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #f0f6fc;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: var(--link);
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
    }

    #unlock-btn {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: var(--accent-color);
      border: 1px solid rgba(240, 246, 252, 0.1);
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    #unlock-btn:hover { background: var(--accent-hover); }
    #unlock-btn:disabled { opacity: 0.7; cursor: wait; }

    .error-msg {
      color: var(--error-color);
      font-size: 14px;
      margin-top: 15px;
      display: none;
      font-weight: 500;
    }

    .lock-icon {
      font-size: 48px;
      margin-bottom: 15px;
      color: var(--link);
    }

    #gate { display: none; }
    body.locked #gate { display: block; }
    #shell { display: none; height: 100%; }
    body.unlocked #shell { display: contents; }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      height: var(--bar-height);
      border-bottom: 1px solid var(--border-color);
      background: var(--container-bg);
      z-index: 5;
    }

    .brand {
      font-weight: 600;
      color: #f0f6fc;
      white-space: nowrap;
      font-size: 14px;
    }

    .latest-pill {
      font-size: 11px;
      font-weight: 600;
      color: #3fb950;
      background: rgba(63, 185, 80, 0.15);
      border: 1px solid rgba(63, 185, 80, 0.35);
      border-radius: 999px;
      padding: 2px 8px;
      display: none;
    }

    .latest-pill.show { display: inline-flex; }

    .spacer { flex: 1; }

    .topbar label {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    #version-select {
      background: var(--input-bg);
      color: #f0f6fc;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      min-width: 110px;
    }

    .bar-btn, .bar-link {
      appearance: none;
      background: transparent;
      color: var(--link);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }

    .bar-btn:hover, .bar-link:hover {
      background: rgba(88, 166, 255, 0.1);
    }

    .bar-link[aria-disabled="true"] {
      opacity: 0.45;
      pointer-events: none;
    }

    .viewer-wrap {
      position: relative;
      min-height: 0;
      height: 100%;
      background: #fff;
    }

    #viewer {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
    }

    .status {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(13, 17, 23, 0.92);
      color: var(--muted);
      font-size: 14px;
      z-index: 2;
    }

    .status.show { display: flex; }

    .notes-panel {
      display: none;
      position: absolute;
      top: calc(var(--bar-height) + 8px);
      right: 12px;
      width: min(360px, calc(100vw - 24px));
      background: var(--container-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      padding: 14px 16px;
      z-index: 10;
    }

    .notes-panel.open { display: block; }

    .notes-panel h3 {
      margin: 0 0 8px;
      font-size: 14px;
      color: #f0f6fc;
    }

    .notes-panel .meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .notes-panel ul {
      margin: 0;
      padding-left: 18px;
      font-size: 13px;
      line-height: 1.5;
    }

    .notes-panel li { margin-bottom: 4px; }

    @media (max-width: 720px) {
      .brand-text { display: none; }
      .topbar { gap: 8px; padding: 0 10px; }
    }
  </style>
</head>
<body class="locked">
  <div class="container" id="gate">
    <div class="lock-icon">🔒</div>
    <h2>Protected Document</h2>
    <p class="gate-copy">This file is encrypted. Enter the access password to decrypt and view the Control Center.</p>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autofocus autocomplete="current-password">
    </div>
    <button id="unlock-btn" type="button">Decrypt &amp; Open</button>
    <div class="error-msg" id="error">Incorrect password. Please try again.</div>
  </div>

  <div id="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-text">Control Center</span></div>
      <span class="latest-pill" id="latest-pill">Latest</span>
      <div class="spacer"></div>
      <label for="version-select">Version</label>
      <select id="version-select" aria-label="Select sketch version"></select>
      <button class="bar-btn" id="notes-btn" type="button" aria-expanded="false">What's new</button>
    </header>

    <div class="viewer-wrap">
      <div class="status" id="status">Loading version…</div>
      <iframe id="viewer" title="Control Center sketch" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads"></iframe>
    </div>

    <aside class="notes-panel" id="notes-panel" hidden>
      <h3 id="notes-title">What's new</h3>
      <div class="meta" id="notes-meta"></div>
      <ul id="notes-list"></ul>
    </aside>
  </div>

  <script>
    const SESSION_KEY = "cc_v2_session_password";
    const params = new URLSearchParams(window.location.search);

    const gate = {
      password: document.getElementById("password"),
      button: document.getElementById("unlock-btn"),
      error: document.getElementById("error"),
    };

    const ui = {
      select: document.getElementById("version-select"),
      latestPill: document.getElementById("latest-pill"),
      notesBtn: document.getElementById("notes-btn"),
      notesPanel: document.getElementById("notes-panel"),
      notesTitle: document.getElementById("notes-title"),
      notesMeta: document.getElementById("notes-meta"),
      notesList: document.getElementById("notes-list"),
      status: document.getElementById("status"),
      viewer: document.getElementById("viewer"),
    };

    /** @type {{ latest: string, github: { owner: string, repo: string }, versions: Array<any> } | null} */
    let manifest = null;
    /** @type {string | null} */
    let activeId = null;
    /** @type {string | null} */
    let sessionPassword = null;

    /**
     * Decode a base64 string into bytes for Web Crypto.
     * @param {string} b64
     * @returns {Uint8Array}
     */
    function b64ToBytes(b64) {
      return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    }

    /**
     * Decrypt an encrypted version payload with the shared gate password.
     * @param {{ saltB64: string, ivB64: string, ciphertextB64: string }} payload
     * @param {string} password
     * @returns {Promise<string>}
     */
    async function decryptPayload(payload, password) {
      const salt = b64ToBytes(payload.saltB64);
      const iv = b64ToBytes(payload.ivB64);
      const ciphertext = b64ToBytes(payload.ciphertextB64);

      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveBits", "deriveKey"]
      );

      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt,
          iterations: 100000,
          hash: "SHA-256",
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const decryptedBuffer = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv },
        key,
        ciphertext
      );

      return new TextDecoder().decode(decryptedBuffer);
    }

    /**
     * @param {string} message
     * @param {boolean} show
     */
    function setStatus(message, show) {
      ui.status.textContent = message;
      ui.status.classList.toggle("show", show);
    }

    /**
     * @param {string} id
     */
    function getVersion(id) {
      return manifest.versions.find((v) => v.id === id) || null;
    }

    /**
     * Prefer ?v=, else latest from the manifest.
     * @returns {string}
     */
    function resolveInitialVersion() {
      const requested = params.get("v");
      if (requested && getVersion(requested)) return requested;
      return manifest.latest;
    }

    function fillVersionSelect() {
      ui.select.innerHTML = "";
      // Newest first for the dropdown.
      const ordered = [...manifest.versions].sort((a, b) => {
        if (a.id === manifest.latest) return -1;
        if (b.id === manifest.latest) return 1;
        return String(b.id).localeCompare(String(a.id), undefined, { numeric: true });
      });

      for (const version of ordered) {
        const opt = document.createElement("option");
        opt.value = version.id;
        opt.textContent =
          version.id === manifest.latest
            ? `${version.label} (latest)`
            : version.label;
        ui.select.appendChild(opt);
      }
    }

    /**
     * Update changelog panel + GitHub compare link for the active version.
     * @param {any} version
     */
    function updateMeta(version) {
      const isLatest = version.id === manifest.latest;
      ui.latestPill.classList.toggle("show", isLatest);
      ui.notesTitle.textContent = `${version.label} — What's new`;
      ui.notesMeta.textContent = version.released
        ? `Released ${version.released}`
        : "";

      ui.notesList.innerHTML = "";
      const notes = Array.isArray(version.notes) ? version.notes : [];
      if (notes.length === 0) {
        const li = document.createElement("li");
        li.textContent = "No release notes for this version.";
        ui.notesList.appendChild(li);
      } else {
        for (const note of notes) {
          const li = document.createElement("li");
          li.textContent = note;
          ui.notesList.appendChild(li);
        }
      }

      // GitHub compare intentionally omitted — client-facing shell only.
    }

    /**
     * Resolve the encrypted payload path for a version (follows patch bases).
     * @param {any} version
     * @returns {any}
     */
    function resolveEncryptedVersion(version) {
      if (version.mode === "patch" && version.base) {
        const base = getVersion(version.base);
        if (!base) throw new Error(`Missing base version: ${version.base}`);
        return base;
      }
      return version;
    }

    /**
     * Apply find/replace patches from a patch payload onto decrypted HTML.
     * @param {string} html
     * @param {{ patches?: Array<{ id?: string, find: string, replace: string }> }} patchPayload
     * @returns {string}
     */
    function applyPatches(html, patchPayload) {
      let out = html;
      const patches = Array.isArray(patchPayload.patches) ? patchPayload.patches : [];
      for (const patch of patches) {
        if (!patch || typeof patch.find !== "string") {
          throw new Error(`Invalid patch${patch && patch.id ? ` (${patch.id})` : ""}`);
        }
        if (!out.includes(patch.find)) {
          throw new Error(
            `Patch did not match encrypted base${patch.id ? `: ${patch.id}` : ""}`
          );
        }
        out = out.replace(patch.find, patch.replace);
      }
      return out;
    }

    /**
     * Fetch + decrypt a version, applying patches when mode=patch.
     * @param {any} version
     * @param {string} password
     * @returns {Promise<string>}
     */
    async function materializeVersionHtml(version, password) {
      const encryptedVersion = resolveEncryptedVersion(version);
      const encryptedRes = await fetch(encryptedVersion.payload, { cache: "no-store" });
      if (!encryptedRes.ok) {
        throw new Error(`Failed to fetch ${encryptedVersion.payload}`);
      }
      const encryptedPayload = await encryptedRes.json();
      let html = await decryptPayload(encryptedPayload, password);

      if (version.mode === "patch") {
        const patchRes = await fetch(version.payload, { cache: "no-store" });
        if (!patchRes.ok) throw new Error(`Failed to fetch ${version.payload}`);
        const patchPayload = await patchRes.json();
        html = applyPatches(html, patchPayload);
      }

      return html;
    }

    /**
     * Decrypt and render a version into the iframe.
     * @param {string} id
     */
    async function loadVersion(id) {
      const version = getVersion(id);
      if (!version) throw new Error(`Unknown version: ${id}`);
      if (!sessionPassword) throw new Error("Not unlocked");

      activeId = id;
      ui.select.value = id;
      updateMeta(version);
      setStatus(`Decrypting ${version.label}…`, true);

      const html = await materializeVersionHtml(version, sessionPassword);

      // Blob URL keeps the sketch sandboxed while supporting relative assets.
      if (ui.viewer.dataset.blobUrl) {
        URL.revokeObjectURL(ui.viewer.dataset.blobUrl);
      }
      const blob = new Blob([html], { type: "text/html" });
      const blobUrl = URL.createObjectURL(blob);
      ui.viewer.dataset.blobUrl = blobUrl;
      ui.viewer.src = blobUrl;

      const url = new URL(window.location.href);
      url.searchParams.set("v", id);
      history.replaceState(null, "", url);

      setStatus("", false);
    }

    function enterShell() {
      document.body.classList.remove("locked");
      document.body.classList.add("unlocked");
      document.title = "Control Center";
    }

    async function attemptUnlock() {
      const password = gate.password.value;
      if (!password) return;

      gate.button.disabled = true;
      gate.button.textContent = "Decrypting…";
      gate.error.style.display = "none";

      try {
        if (!manifest) {
          manifest = await (await fetch("versions.json", { cache: "no-store" })).json();
        }

        const initialId = resolveInitialVersion();
        const version = getVersion(initialId);

        // Validate password against the encrypted base (patch versions inherit it).
        await materializeVersionHtml(version, password);

        sessionPassword = password;
        sessionStorage.setItem(SESSION_KEY, password);
        fillVersionSelect();
        enterShell();
        await loadVersion(initialId);
      } catch (err) {
        console.error("Decryption failed:", err);
        gate.error.style.display = "block";
        gate.button.disabled = false;
        gate.button.textContent = "Decrypt & Open";
        gate.password.focus();
      }
    }

    async function resumeSession() {
      const saved = sessionStorage.getItem(SESSION_KEY);
      if (!saved) return false;

      try {
        manifest = await (await fetch("versions.json", { cache: "no-store" })).json();
        sessionPassword = saved;
        fillVersionSelect();
        enterShell();
        await loadVersion(resolveInitialVersion());
        return true;
      } catch (err) {
        console.warn("Session resume failed, prompting for password.", err);
        sessionStorage.removeItem(SESSION_KEY);
        sessionPassword = null;
        return false;
      }
    }

    ui.select.addEventListener("change", async () => {
      try {
        await loadVersion(ui.select.value);
      } catch (err) {
        console.error(err);
        setStatus("Could not load that version. Try unlocking again.", true);
      }
    });

    ui.notesBtn.addEventListener("click", () => {
      const open = !ui.notesPanel.classList.contains("open");
      ui.notesPanel.hidden = !open;
      ui.notesPanel.classList.toggle("open", open);
      ui.notesBtn.setAttribute("aria-expanded", String(open));
    });

    document.addEventListener("click", (event) => {
      if (!ui.notesPanel.classList.contains("open")) return;
      const target = event.target;
      if (ui.notesPanel.contains(target) || ui.notesBtn.contains(target)) return;
      ui.notesPanel.classList.remove("open");
      ui.notesPanel.hidden = true;
      ui.notesBtn.setAttribute("aria-expanded", "false");
    });

    gate.button.addEventListener("click", attemptUnlock);
    gate.password.addEventListener("keypress", (e) => {
      if (e.key === "Enter") attemptUnlock();
    });

    resumeSession();
  </script>
</body>
</html>
