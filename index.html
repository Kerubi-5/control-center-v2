<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Center</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --container-bg: #161b22;
      --text-color: #c9d1d9;
      --muted: #8b949e;
      --accent-color: #238636;
      --accent-hover: #2ea043;
      --border-color: #30363d;
      --input-bg: #0d1117;
      --error-color: #f85149;
      --link: #58a6ff;
      --bar-height: 52px;
      --compare-label-height: 36px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    body.locked {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    body.unlocked {
      display: grid;
      grid-template-rows: var(--bar-height) 1fr;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      background: var(--container-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 600;
      color: #f0f6fc;
    }

    .gate-copy {
      font-size: 14px;
      color: var(--muted);
      margin: 0 0 25px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #f0f6fc;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: var(--link);
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
    }

    #unlock-btn {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: var(--accent-color);
      border: 1px solid rgba(240, 246, 252, 0.1);
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    #unlock-btn:hover { background: var(--accent-hover); }
    #unlock-btn:disabled { opacity: 0.7; cursor: wait; }

    .error-msg {
      color: var(--error-color);
      font-size: 14px;
      margin-top: 15px;
      display: none;
      font-weight: 500;
    }

    .lock-icon {
      font-size: 48px;
      margin-bottom: 15px;
      color: var(--link);
    }

    #gate { display: none; }
    body.locked #gate { display: block; }
    #shell { display: none; height: 100%; }
    body.unlocked #shell { display: contents; }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      height: var(--bar-height);
      border-bottom: 1px solid var(--border-color);
      background: var(--container-bg);
      z-index: 5;
    }

    .brand {
      font-weight: 600;
      color: #f0f6fc;
      white-space: nowrap;
      font-size: 14px;
    }

    .latest-pill {
      font-size: 11px;
      font-weight: 600;
      color: #3fb950;
      background: rgba(63, 185, 80, 0.15);
      border: 1px solid rgba(63, 185, 80, 0.35);
      border-radius: 999px;
      padding: 2px 8px;
      display: none;
    }

    .latest-pill.show { display: inline-flex; }

    .spacer { flex: 1; }

    .topbar label {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .topbar select {
      background: var(--input-bg);
      color: #f0f6fc;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      min-width: 100px;
    }

    .single-controls { display: flex; align-items: center; gap: 10px; }
    .compare-controls {
      display: none;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    body.compare-mode .single-controls { display: none; }
    body.compare-mode .compare-controls { display: flex; }
    body.compare-mode .latest-pill { display: none !important; }

    .bar-btn {
      appearance: none;
      background: transparent;
      color: var(--link);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .bar-btn:hover { background: rgba(88, 166, 255, 0.1); }
    .bar-btn.active {
      background: rgba(88, 166, 255, 0.18);
      border-color: rgba(88, 166, 255, 0.45);
    }

    .sync-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      cursor: pointer;
    }

    .sync-label input {
      margin: 0;
    }

    .viewer-wrap {
      position: relative;
      min-height: 0;
      height: 100%;
      background: #fff;
    }

    #viewer-single {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
    }

    body.compare-mode #viewer-single { display: none; }

    .compare-grid {
      display: none;
      height: 100%;
      grid-template-columns: 1fr 1fr;
      min-height: 0;
    }

    body.compare-mode .compare-grid { display: grid; }

    .compare-pane {
      display: grid;
      grid-template-rows: var(--compare-label-height) 1fr;
      min-width: 0;
      min-height: 0;
      border-right: 1px solid var(--border-color);
      background: #fff;
    }

    .compare-pane:last-child { border-right: 0; }

    .compare-pane-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: #f6f8fa;
      border-bottom: 1px solid #d0d7de;
      color: #24292f;
      font-size: 12px;
      font-weight: 650;
    }

    .compare-pane-label .tag {
      font-size: 11px;
      font-weight: 600;
      color: #57606a;
      background: #eaeef2;
      border-radius: 999px;
      padding: 2px 8px;
    }

    .compare-pane iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
      min-height: 0;
    }

    .status {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(13, 17, 23, 0.92);
      color: var(--muted);
      font-size: 14px;
      z-index: 2;
    }

    .status.show { display: flex; }

    .notes-panel {
      display: none;
      position: absolute;
      top: calc(var(--bar-height) + 8px);
      right: 12px;
      width: min(360px, calc(100vw - 24px));
      background: var(--container-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      padding: 14px 16px;
      z-index: 10;
    }

    .notes-panel.open { display: block; }

    .notes-panel h3 {
      margin: 0 0 8px;
      font-size: 14px;
      color: #f0f6fc;
    }

    .notes-panel .meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .notes-panel ul {
      margin: 0;
      padding-left: 18px;
      font-size: 13px;
      line-height: 1.5;
    }

    .notes-panel li { margin-bottom: 4px; }

    @media (max-width: 900px) {
      body.compare-mode .compare-grid {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
      .compare-pane { border-right: 0; border-bottom: 1px solid var(--border-color); }
      .compare-pane:last-child { border-bottom: 0; }
      .brand-text { display: none; }
      .topbar { gap: 8px; padding: 0 10px; overflow-x: auto; }
    }
  </style>
</head>
<body class="locked">
  <div class="container" id="gate">
    <div class="lock-icon">🔒</div>
    <h2>Protected Document</h2>
    <p class="gate-copy">This file is encrypted. Enter the access password to decrypt and view the Control Center.</p>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autofocus autocomplete="current-password">
    </div>
    <button id="unlock-btn" type="button">Decrypt &amp; Open</button>
    <div class="error-msg" id="error">Incorrect password. Please try again.</div>
  </div>

  <div id="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-text">Control Center</span></div>
      <span class="latest-pill" id="latest-pill">Latest</span>
      <div class="spacer"></div>

      <div class="single-controls">
        <label for="version-select">Version</label>
        <select id="version-select" aria-label="Select sketch version"></select>
      </div>

      <div class="compare-controls" aria-label="Compare versions">
        <label for="compare-left">Left</label>
        <select id="compare-left" aria-label="Left version"></select>
        <label for="compare-right">Right</label>
        <select id="compare-right" aria-label="Right version"></select>
        <label class="sync-label" title="Keep both sides scrolling together">
          <input type="checkbox" id="sync-scroll" checked>
          Sync scroll
        </label>
      </div>

      <button class="bar-btn" id="compare-btn" type="button" aria-pressed="false">Compare</button>
      <button class="bar-btn" id="notes-btn" type="button" aria-expanded="false">What's new</button>
    </header>

    <div class="viewer-wrap">
      <div class="status" id="status">Loading version…</div>
      <iframe id="viewer-single" title="Control Center sketch" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads"></iframe>
      <div class="compare-grid" id="compare-grid">
        <div class="compare-pane">
          <div class="compare-pane-label"><span id="compare-left-label">Earlier</span><span class="tag">Before</span></div>
          <iframe id="viewer-left" title="Earlier version" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads"></iframe>
        </div>
        <div class="compare-pane">
          <div class="compare-pane-label"><span id="compare-right-label">Later</span><span class="tag">After</span></div>
          <iframe id="viewer-right" title="Later version" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads"></iframe>
        </div>
      </div>
    </div>

    <aside class="notes-panel" id="notes-panel" hidden>
      <h3 id="notes-title">What's new</h3>
      <div class="meta" id="notes-meta"></div>
      <ul id="notes-list"></ul>
    </aside>
  </div>

  <script>
    const SESSION_KEY = "cc_v2_session_password";
    const params = new URLSearchParams(window.location.search);

    const gate = {
      password: document.getElementById("password"),
      button: document.getElementById("unlock-btn"),
      error: document.getElementById("error"),
    };

    const ui = {
      select: document.getElementById("version-select"),
      compareLeft: document.getElementById("compare-left"),
      compareRight: document.getElementById("compare-right"),
      compareLeftLabel: document.getElementById("compare-left-label"),
      compareRightLabel: document.getElementById("compare-right-label"),
      compareBtn: document.getElementById("compare-btn"),
      syncScroll: document.getElementById("sync-scroll"),
      latestPill: document.getElementById("latest-pill"),
      notesBtn: document.getElementById("notes-btn"),
      notesPanel: document.getElementById("notes-panel"),
      notesTitle: document.getElementById("notes-title"),
      notesMeta: document.getElementById("notes-meta"),
      notesList: document.getElementById("notes-list"),
      status: document.getElementById("status"),
      viewer: document.getElementById("viewer-single"),
      viewerLeft: document.getElementById("viewer-left"),
      viewerRight: document.getElementById("viewer-right"),
    };

    /** @type {{ latest: string, versions: Array<any> } | null} */
    let manifest = null;
    /** @type {string | null} */
    let activeId = null;
    /** @type {string | null} */
    let sessionPassword = null;
    let compareMode = false;
    /** @type {Record<string, string>} */
    const blobCache = {};
    let syncingScroll = false;

    /**
     * Decode a base64 string into bytes for Web Crypto.
     * @param {string} b64
     * @returns {Uint8Array}
     */
    function b64ToBytes(b64) {
      return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    }

    /**
     * Decrypt an encrypted version payload with the shared gate password.
     * @param {{ saltB64: string, ivB64: string, ciphertextB64: string }} payload
     * @param {string} password
     * @returns {Promise<string>}
     */
    async function decryptPayload(payload, password) {
      const salt = b64ToBytes(payload.saltB64);
      const iv = b64ToBytes(payload.ivB64);
      const ciphertext = b64ToBytes(payload.ciphertextB64);

      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveBits", "deriveKey"]
      );

      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt,
          iterations: 100000,
          hash: "SHA-256",
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const decryptedBuffer = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv },
        key,
        ciphertext
      );

      return new TextDecoder().decode(decryptedBuffer);
    }

    /**
     * @param {string} message
     * @param {boolean} show
     */
    function setStatus(message, show) {
      ui.status.textContent = message;
      ui.status.classList.toggle("show", show);
    }

    /**
     * @param {string} id
     */
    function getVersion(id) {
      return manifest.versions.find((v) => v.id === id) || null;
    }

    /**
     * Versions sorted newest-first for dropdowns.
     * @returns {Array<any>}
     */
    function orderedVersions() {
      return [...manifest.versions].sort((a, b) => {
        if (a.id === manifest.latest) return -1;
        if (b.id === manifest.latest) return 1;
        return String(b.id).localeCompare(String(a.id), undefined, { numeric: true });
      });
    }

    /**
     * Prefer ?v=, else latest from the manifest.
     * @returns {string}
     */
    function resolveInitialVersion() {
      const requested = params.get("v");
      if (requested && getVersion(requested)) return requested;
      return manifest.latest;
    }

    /**
     * Default compare pair: previous version vs latest (or active).
     * @returns {[string, string]}
     */
    function defaultComparePair() {
      const orderedAsc = [...manifest.versions].sort((a, b) =>
        String(a.id).localeCompare(String(b.id), undefined, { numeric: true })
      );
      const right =
        (params.get("right") && getVersion(params.get("right")) && params.get("right")) ||
        activeId ||
        manifest.latest;
      const rightIdx = orderedAsc.findIndex((v) => v.id === right);
      const leftFromParam = params.get("left");
      let left =
        leftFromParam && getVersion(leftFromParam)
          ? leftFromParam
          : rightIdx > 0
            ? orderedAsc[rightIdx - 1].id
            : orderedAsc[0].id;
      if (left === right && orderedAsc.length > 1) {
        left = orderedAsc[Math.max(0, rightIdx - 1)].id;
        if (left === right) left = orderedAsc.find((v) => v.id !== right).id;
      }
      return [left, right];
    }

    /**
     * @param {HTMLSelectElement} select
     * @param {string} [selectedId]
     */
    function fillSelect(select, selectedId) {
      select.innerHTML = "";
      for (const version of orderedVersions()) {
        const opt = document.createElement("option");
        opt.value = version.id;
        opt.textContent =
          version.id === manifest.latest
            ? `${version.label} (latest)`
            : version.label;
        select.appendChild(opt);
      }
      if (selectedId && getVersion(selectedId)) select.value = selectedId;
    }

    function fillVersionSelects() {
      fillSelect(ui.select, activeId || manifest.latest);
      const [left, right] = defaultComparePair();
      fillSelect(ui.compareLeft, left);
      fillSelect(ui.compareRight, right);
    }

    /**
     * Update changelog panel for a version.
     * @param {any} version
     */
    function updateMeta(version) {
      const isLatest = version.id === manifest.latest;
      ui.latestPill.classList.toggle("show", !compareMode && isLatest);
      ui.notesTitle.textContent = `${version.label} — What's new`;
      ui.notesMeta.textContent = version.released
        ? `Released ${version.released}`
        : "";

      ui.notesList.innerHTML = "";
      const notes = Array.isArray(version.notes) ? version.notes : [];
      if (notes.length === 0) {
        const li = document.createElement("li");
        li.textContent = "No release notes for this version.";
        ui.notesList.appendChild(li);
      } else {
        for (const note of notes) {
          const li = document.createElement("li");
          li.textContent = note;
          ui.notesList.appendChild(li);
        }
      }
    }

    /**
     * Resolve the encrypted payload path for a version (follows patch bases).
     * @param {any} version
     * @returns {any}
     */
    function resolveEncryptedVersion(version) {
      if (version.mode === "patch" && version.base) {
        const base = getVersion(version.base);
        if (!base) throw new Error(`Missing base version: ${version.base}`);
        return base;
      }
      return version;
    }

    /**
     * Apply find/replace patches from a patch payload onto decrypted HTML.
     * @param {string} html
     * @param {{ patches?: Array<{ id?: string, find: string, replace: string }> }} patchPayload
     * @returns {string}
     */
    function applyPatches(html, patchPayload) {
      let out = html;
      const patches = Array.isArray(patchPayload.patches) ? patchPayload.patches : [];
      for (const patch of patches) {
        if (!patch || typeof patch.find !== "string") {
          throw new Error(`Invalid patch${patch && patch.id ? ` (${patch.id})` : ""}`);
        }
        if (!out.includes(patch.find)) {
          throw new Error(
            `Patch did not match encrypted base${patch.id ? `: ${patch.id}` : ""}`
          );
        }
        out = out.replace(patch.find, patch.replace);
      }
      return out;
    }

    /**
     * Fetch + decrypt a version, applying patches when mode=patch.
     * @param {any} version
     * @param {string} password
     * @returns {Promise<string>}
     */
    async function materializeVersionHtml(version, password) {
      const encryptedVersion = resolveEncryptedVersion(version);
      const encryptedRes = await fetch(encryptedVersion.payload, { cache: "no-store" });
      if (!encryptedRes.ok) {
        throw new Error(`Failed to fetch ${encryptedVersion.payload}`);
      }
      const encryptedPayload = await encryptedRes.json();
      let html = await decryptPayload(encryptedPayload, password);

      if (version.mode === "patch") {
        const patchRes = await fetch(version.payload, { cache: "no-store" });
        if (!patchRes.ok) throw new Error(`Failed to fetch ${version.payload}`);
        const patchPayload = await patchRes.json();
        html = applyPatches(html, patchPayload);
      }

      return html;
    }

    /**
     * Decrypt a version once and cache a blob URL for iframes.
     * @param {string} id
     * @returns {Promise<string>}
     */
    async function getBlobUrl(id) {
      if (blobCache[id]) return blobCache[id];
      const version = getVersion(id);
      if (!version) throw new Error(`Unknown version: ${id}`);
      const html = await materializeVersionHtml(version, sessionPassword);
      const blob = new Blob([html], { type: "text/html" });
      const blobUrl = URL.createObjectURL(blob);
      blobCache[id] = blobUrl;
      return blobUrl;
    }

    /**
     * @param {HTMLIFrameElement} iframe
     * @param {string} id
     */
    async function setIframeVersion(iframe, id) {
      iframe.src = await getBlobUrl(id);
    }

    function updateUrl() {
      const url = new URL(window.location.href);
      if (compareMode) {
        url.searchParams.set("mode", "compare");
        url.searchParams.set("left", ui.compareLeft.value);
        url.searchParams.set("right", ui.compareRight.value);
        url.searchParams.delete("v");
      } else {
        url.searchParams.delete("mode");
        url.searchParams.delete("left");
        url.searchParams.delete("right");
        if (activeId) url.searchParams.set("v", activeId);
      }
      history.replaceState(null, "", url);
    }

    /**
     * Decrypt and render a single version.
     * @param {string} id
     */
    async function loadVersion(id) {
      const version = getVersion(id);
      if (!version) throw new Error(`Unknown version: ${id}`);
      if (!sessionPassword) throw new Error("Not unlocked");

      activeId = id;
      ui.select.value = id;
      updateMeta(version);
      setStatus(`Loading ${version.label}…`, true);
      await setIframeVersion(ui.viewer, id);
      updateUrl();
      setStatus("", false);
    }

    /**
     * Load both compare panes.
     */
    async function loadCompare() {
      const leftId = ui.compareLeft.value;
      const rightId = ui.compareRight.value;
      const left = getVersion(leftId);
      const right = getVersion(rightId);
      if (!left || !right) throw new Error("Unknown compare versions");

      ui.compareLeftLabel.textContent = left.label;
      ui.compareRightLabel.textContent = right.label;
      updateMeta(right);
      setStatus(`Loading ${left.label} and ${right.label}…`, true);

      await Promise.all([
        setIframeVersion(ui.viewerLeft, leftId),
        setIframeVersion(ui.viewerRight, rightId),
      ]);

      wireSyncScroll();
      updateUrl();
      setStatus("", false);
    }

    /**
     * Keep both compare iframes scrolling together when enabled.
     */
    function wireSyncScroll() {
      const leftWin = ui.viewerLeft.contentWindow;
      const rightWin = ui.viewerRight.contentWindow;
      if (!leftWin || !rightWin) return;

      const onScroll = (source, target) => () => {
        if (!ui.syncScroll.checked || syncingScroll) return;
        syncingScroll = true;
        try {
          const doc = source.document.documentElement;
          const maxY = Math.max(1, doc.scrollHeight - source.innerHeight);
          const maxX = Math.max(1, doc.scrollWidth - source.innerWidth);
          const ratioY = source.scrollY / maxY;
          const ratioX = source.scrollX / maxX;
          const tDoc = target.document.documentElement;
          target.scrollTo(
            ratioX * Math.max(1, tDoc.scrollWidth - target.innerWidth),
            ratioY * Math.max(1, tDoc.scrollHeight - target.innerHeight)
          );
        } catch (_) {
          // Cross-frame access can fail briefly while a blob navigates.
        }
        syncingScroll = false;
      };

      leftWin.onscroll = onScroll(leftWin, rightWin);
      rightWin.onscroll = onScroll(rightWin, leftWin);
    }

    /**
     * @param {boolean} enabled
     */
    async function setCompareMode(enabled) {
      compareMode = enabled;
      document.body.classList.toggle("compare-mode", enabled);
      ui.compareBtn.classList.toggle("active", enabled);
      ui.compareBtn.setAttribute("aria-pressed", String(enabled));
      ui.compareBtn.textContent = enabled ? "Exit compare" : "Compare";

      if (enabled) {
        if (manifest.versions.length < 2) {
          setStatus("Need at least two versions to compare.", true);
          compareMode = false;
          document.body.classList.remove("compare-mode");
          ui.compareBtn.classList.remove("active");
          ui.compareBtn.setAttribute("aria-pressed", "false");
          ui.compareBtn.textContent = "Compare";
          return;
        }
        const [left, right] = defaultComparePair();
        fillSelect(ui.compareLeft, left);
        fillSelect(ui.compareRight, right);
        await loadCompare();
      } else {
        await loadVersion(activeId || manifest.latest);
      }
    }

    function enterShell() {
      document.body.classList.remove("locked");
      document.body.classList.add("unlocked");
      document.title = "Control Center";
    }

    async function attemptUnlock() {
      const password = gate.password.value;
      if (!password) return;

      gate.button.disabled = true;
      gate.button.textContent = "Decrypting…";
      gate.error.style.display = "none";

      try {
        if (!manifest) {
          manifest = await (await fetch("versions.json", { cache: "no-store" })).json();
        }

        const initialId = resolveInitialVersion();
        const version = getVersion(initialId);
        await materializeVersionHtml(version, password);

        sessionPassword = password;
        sessionStorage.setItem(SESSION_KEY, password);
        activeId = initialId;
        fillVersionSelects();
        enterShell();

        if (params.get("mode") === "compare" && manifest.versions.length > 1) {
          await setCompareMode(true);
        } else {
          await loadVersion(initialId);
        }
      } catch (err) {
        console.error("Decryption failed:", err);
        gate.error.style.display = "block";
        gate.button.disabled = false;
        gate.button.textContent = "Decrypt & Open";
        gate.password.focus();
      }
    }

    async function resumeSession() {
      const saved = sessionStorage.getItem(SESSION_KEY);
      if (!saved) return false;

      try {
        manifest = await (await fetch("versions.json", { cache: "no-store" })).json();
        sessionPassword = saved;
        activeId = resolveInitialVersion();
        fillVersionSelects();
        enterShell();
        if (params.get("mode") === "compare" && manifest.versions.length > 1) {
          await setCompareMode(true);
        } else {
          await loadVersion(activeId);
        }
        return true;
      } catch (err) {
        console.warn("Session resume failed, prompting for password.", err);
        sessionStorage.removeItem(SESSION_KEY);
        sessionPassword = null;
        return false;
      }
    }

    ui.select.addEventListener("change", async () => {
      try {
        await loadVersion(ui.select.value);
      } catch (err) {
        console.error(err);
        setStatus("Could not load that version. Try unlocking again.", true);
      }
    });

    ui.compareLeft.addEventListener("change", async () => {
      try {
        await loadCompare();
      } catch (err) {
        console.error(err);
        setStatus("Could not load compare view.", true);
      }
    });

    ui.compareRight.addEventListener("change", async () => {
      try {
        await loadCompare();
      } catch (err) {
        console.error(err);
        setStatus("Could not load compare view.", true);
      }
    });

    ui.compareBtn.addEventListener("click", async () => {
      try {
        await setCompareMode(!compareMode);
      } catch (err) {
        console.error(err);
        setStatus("Could not open compare view.", true);
      }
    });

    ui.viewerLeft.addEventListener("load", () => {
      if (compareMode) wireSyncScroll();
    });
    ui.viewerRight.addEventListener("load", () => {
      if (compareMode) wireSyncScroll();
    });

    ui.notesBtn.addEventListener("click", () => {
      const open = !ui.notesPanel.classList.contains("open");
      ui.notesPanel.hidden = !open;
      ui.notesPanel.classList.toggle("open", open);
      ui.notesBtn.setAttribute("aria-expanded", String(open));
    });

    document.addEventListener("click", (event) => {
      if (!ui.notesPanel.classList.contains("open")) return;
      const target = event.target;
      if (ui.notesPanel.contains(target) || ui.notesBtn.contains(target)) return;
      ui.notesPanel.classList.remove("open");
      ui.notesPanel.hidden = true;
      ui.notesBtn.setAttribute("aria-expanded", "false");
    });

    gate.button.addEventListener("click", attemptUnlock);
    gate.password.addEventListener("keypress", (e) => {
      if (e.key === "Enter") attemptUnlock();
    });

    resumeSession();
  </script>
</body>
</html>
