<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access - Control Center</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --container-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #238636;
            --accent-hover: #2ea043;
            --border-color: #30363d;
            --input-bg: #0d1117;
            --error-color: #f85149;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h2 {
            margin-top: 0;
            font-size: 24px;
            font-weight: 600;
            color: #f0f6fc;
        }
        p {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 25px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #c9d1d9;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #f0f6fc;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--accent-color);
            border: 1px solid rgba(240, 246, 252, 0.1);
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        .error-msg {
            color: var(--error-color);
            font-size: 14px;
            margin-top: 15px;
            display: none;
            text-align: center;
            font-weight: 500;
        }
        .lock-icon {
            font-size: 48px;
            margin-bottom: 15px;
            color: #58a6ff;
        }
    </style>
</head>
<body>
    <div class="container" id="login-box">
        <div class="lock-icon">🔒</div>
        <h2>Protected Document</h2>
        <p>This file is encrypted. Enter the access password to decrypt and view the Control Center.</p>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" autofocus autocomplete="current-password">
        </div>
        
        <button id="unlock-btn" onclick="attemptUnlock()">Decrypt & Open</button>
        <div class="error-msg" id="error">Incorrect password. Please try again.</div>
    </div>

        // Listen for Enter key press
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                attemptUnlock();
            }
        });

        async function attemptUnlock() {
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const btn = document.getElementById('unlock-btn');
            
            if (!password) return;
            
            btn.disabled = true;
            btn.innerText = "Decrypting...";
            errorDiv.style.display = 'none';

            try {
                // 1. Convert Base64 back to Uint8Arrays
                const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
                const iv = Uint8Array.from(atob(ivB64), c => c.charCodeAt(0));
                const ciphertext = Uint8Array.from(atob(ciphertextB64), c => c.charCodeAt(0));

                // 2. Import Key Material from User's Password
                const keyMaterial = await window.crypto.subtle.importKey(
                    "raw",
                    new TextEncoder().encode(password),
                    "PBKDF2",
                    false,
                    ["deriveBits", "deriveKey"]
                );

                // 3. Derive decryption key using exact PBKDF2 settings matching Node.js
                const key = await window.crypto.subtle.deriveKey(
                    {
                        name: "PBKDF2",
                        salt: salt,
                        iterations: 100000,
                        hash: "SHA-256"
                    },
                    keyMaterial,
                    { name: "AES-GCM", length: 256 },
                    false,
                    ["decrypt"]
                );

                // 4. Perform AES-GCM Decryption (SubtleCrypto expects the ciphertext + tag)
                const decryptedBuffer = await window.crypto.subtle.decrypt(
                    {
                        name: "AES-GCM",
                        iv: iv
                    },
                    key,
                    ciphertext
                );

                // 5. Decode decrypted data as text
                const decryptedHtml = new TextDecoder().decode(decryptedBuffer);

                // 6. Replace the entire page content with the decrypted HTML
                document.open();
                document.write(decryptedHtml);
                document.close();

            } catch (err) {
                console.error("Decryption failed:", err);
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.innerText = "Decrypt & Open";
                document.getElementById('password').focus();
            }
        }
